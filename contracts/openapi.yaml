            schema:
              $ref: '#/components/schemas/CreateSource'
  /v1/projects/{project_id}/sources/{source_id}:
    get:
      operationId: getSource
      summary: Administrator source status and current epoch, including failed reseeds
      parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/source_id'
      responses:
        '200':
          description: Current source admission status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        default:
          description: Structured failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/projects/{project_id}/sources/{source_id}/actions:
    post:
