      operationId: createSource
      summary: Register an administrator-approved source; no arbitrary agent DSN
      parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceAccepted'
        '400':
          description: Structured failure; detail must not expose secrets or source
            row values
