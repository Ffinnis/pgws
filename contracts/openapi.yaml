openapi: 3.1.0
info:
  title: PG Workspaces core lifecycle API
  version: 0.3.0
  description: Proposed contract accompanying RFC-0001. Not a deployed service. Source/policy
    administration and pagination will be extended separately. All cross-resource
    lookups require current tenant/project authorization. No public server URL is
    specified.
security:
- bearerAuth: []
paths:
