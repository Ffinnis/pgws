      summary: Administrator reseed into a new immutable baseline generation
      parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/source_id'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceAction'
      responses:
        '202':
          description: New epoch and generation reserved; existing workspaces retain their lineage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceReseedAccepted'
        default:
          description: Structured failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
